<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PiklrPH — Play Pickleball in the Philippines</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0B131E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts & Tailwind -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#070B11] text-slate-100 min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 select-none">

  <!-- Mobile Frame Container (max-w: 420px, h: 880px) -->
  <div class="relative w-full max-w-[420px] h-screen sm:h-[880px] bg-[#0B131E] sm:rounded-[40px] border border-slate-800 shadow-2xl flex flex-col justify-between overflow-hidden">
    
    <!-- Top System Header Bar -->
    <header class="pt-3 pb-2 px-5 flex items-center justify-between z-30 shrink-0 bg-[#0B131E]/95 backdrop-blur-md border-b border-slate-800/60">
      <div class="flex items-center gap-2">
        <img src="logo.png" alt="PiklrPH" class="h-6 w-auto object-contain" />
        <span class="text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-[#CCFF00]/15 text-[#CCFF00] border border-[#CCFF00]/30">
          Philippine Pickleball
        </span>
      </div>
      <div class="flex items-center gap-2">
        <a href="admin.html" target="_blank" rel="noopener noreferrer" class="text-[10px] font-bold text-slate-400 hover:text-white bg-slate-800/80 px-2 py-1 rounded-lg border border-slate-700">HQ Admin ↗</a>
        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
      </div>
    </header>

    <!-- Dynamic Module Viewport (Iframe) -->
    <main class="flex-1 relative overflow-hidden bg-[#070B11]">
      <iframe id="app-viewport" src="module2.html" class="w-full h-full border-none" loading="eager"></iframe>
    </main>

    <!-- Simplified Bottom Tab Bar -->
    <nav class="h-16 bg-[#111827]/95 backdrop-blur-lg border-t border-slate-800 px-2 py-1 flex items-center justify-around z-40 shrink-0">
      
      <!-- Tab 1: Book Courts -->
      <button id="tab-btn-courts" onclick="navigateTab('module2.html', this)" class="app-tab flex-1 flex flex-col items-center justify-center py-1 text-[#CCFF00] transition cursor-pointer">
        <i data-lucide="map-pin" class="w-4 h-4"></i>
        <span class="text-[10px] font-black mt-0.5">Courts</span>
      </button>

      <!-- Tab 2: Queue (Pila) -->
      <button id="tab-btn-pila" onclick="navigateTab('module3.html', this)" class="app-tab flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-white transition cursor-pointer">
        <i data-lucide="clock" class="w-4 h-4"></i>
        <span class="text-[10px] font-bold mt-0.5">Queue</span>
      </button>

      <!-- Tab 3: Easy Scorekeeper (Referee) -->
      <button id="tab-btn-referee" onclick="navigateTab('module4.html', this)" class="app-tab flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-white transition cursor-pointer">
        <div class="relative">
          <div class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300">
            <i data-lucide="award" class="w-3.5 h-3.5 text-[#CCFF00]"></i>
          </div>
        </div>
        <span class="text-[10px] font-bold mt-0.5">Scorer</span>
      </button>

      <!-- Tab 4: Shop Gear & Perks -->
      <button id="tab-btn-exchange" onclick="navigateTab('module7.html', this)" class="app-tab flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-white transition cursor-pointer">
        <i data-lucide="shopping-bag" class="w-4 h-4"></i>
        <span class="text-[10px] font-bold mt-0.5">Shop</span>
      </button>

      <!-- Tab 5: Player Profile & Card -->
      <button id="tab-btn-passport" onclick="navigateTab('passport.html', this)" class="app-tab flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-white transition cursor-pointer">
        <i data-lucide="user" class="w-4 h-4"></i>
        <span class="text-[10px] font-bold mt-0.5">Profile</span>
      </button>

    </nav>
  </div>

  <script>
    function navigateTab(moduleUrl, btnElement) {
      const viewport = document.getElementById('app-viewport');
      if (viewport) {
        viewport.src = moduleUrl;
      }

      document.querySelectorAll('.app-tab').forEach(b => {
        b.className = 'app-tab flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-white transition cursor-pointer';
        const span = b.querySelector('span');
        if (span) span.className = 'text-[10px] font-bold mt-0.5';
      });

      if (btnElement) {
        btnElement.className = 'app-tab flex-1 flex flex-col items-center justify-center py-1 text-[#CCFF00] transition cursor-pointer';
        const activeSpan = btnElement.querySelector('span');
        if (activeSpan) activeSpan.className = 'text-[10px] font-black mt-0.5';
      }

      if (window.lucide) lucide.createIcons();
    }

    // Standardized Global Shell Bridge for all child modules
    window.switchModule = function(moduleName) {
      const routeMap = {
        courts: { url: 'module2.html', id: 'tab-btn-courts' },
        pila: { url: 'module3.html', id: 'tab-btn-pila' },
        referee: { url: 'module4.html', id: 'tab-btn-referee' },
        exchange: { url: 'module7.html', id: 'tab-btn-exchange' },
        passport: { url: 'passport.html', id: 'tab-btn-passport' },
        // Secondary modules accessible via in-app links:
        tournaments: { url: 'module5.html', id: 'tab-btn-referee' },
        coaches: { url: 'module6.html', id: 'tab-btn-courts' },
        community: { url: 'module8.html', id: 'tab-btn-exchange' }
      };

      const target = routeMap[moduleName];
      if (target) {
        const btn = document.getElementById(target.id);
        navigateTab(target.url, btn);
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>

  <script>
  // Register Service Worker for PWA & Android TWA offline readiness
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('./sw.js')
        .then((reg) => {
          console.log('[PWA] Service Worker registered successfully:', reg.scope);
        })
        .catch((err) => {
          console.warn('[PWA] Service Worker registration failed:', err);
        });
    });
  }
  </script>
  
</body>
</html>
