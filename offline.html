<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PiklrPH — No Connection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style> * { font-family: 'Outfit', sans-serif; } </style>
</head>
<body class="bg-[#0B131E] text-slate-100 min-h-screen flex items-center justify-center p-6 select-none text-center">
  <div class="max-w-xs w-full bg-[#111827] border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center">
    <div class="w-16 h-16 rounded-full bg-amber-500/10 border-2 border-amber-400 flex items-center justify-center text-amber-400 mb-3">
      <span class="text-2xl">📡</span>
    </div>
    
    <h1 class="text-base font-black text-white">Court Connection Lost</h1>
    <p class="text-xs text-slate-400 mt-1 leading-relaxed">
      You are currently offline. Check your mobile data or court Wi-Fi and try again.
    </p>

    <div class="my-4 p-3 rounded-2xl bg-[#0B131E] border border-slate-800 w-full text-xs text-slate-300">
      ⚡ Cached views (Rules, Scorer, and Saved Matches) remain accessible offline.
    </div>

    <button 
      onclick="window.location.reload()" 
      class="w-full py-3 rounded-xl bg-[#CCFF00] hover:bg-[#d8ff33] text-black font-black text-xs uppercase tracking-wider transition cursor-pointer"
    >
      Try Reconnecting
    </button>
  </div>
</body>
</html>
