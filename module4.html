<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiklrPH - Easy Match Scorer</title>
  
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { font-family: 'Outfit', sans-serif; user-select: none; }
  </style>
</head>
<body class="bg-[#070B11] text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

  <div class="w-full max-w-[420px] h-[880px] max-h-screen bg-[#0B131E] sm:rounded-3xl shadow-2xl border border-slate-800 flex flex-col justify-between overflow-hidden">
    
    <!-- Top Bar -->
    <div class="p-3 bg-[#111827] border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-[#CCFF00]/15 text-[#CCFF00] flex items-center justify-center font-bold">
          <i data-lucide="award" class="w-4 h-4"></i>
        </div>
        <div>
          <h2 class="text-xs font-black text-white">Easy Match Scorer</h2>
          <span class="text-[10px] text-slate-400">First to 11 points (Win by 2)</span>
        </div>
      </div>
      <button onclick="resetMatch()" class="text-[10px] font-bold text-slate-400 hover:text-white px-2 py-1 rounded bg-slate-800">
        Reset
      </button>
    </div>

    <!-- Main Score Area -->
    <div class="flex-1 p-4 flex flex-col justify-between">

      <!-- Who is Serving Callout -->
      <div class="p-3 rounded-2xl bg-slate-900 border border-slate-800 text-center">
        <span class="text-[10px] font-extrabold uppercase text-[#CCFF00] tracking-wider block">
          Current Server
        </span>
        <h3 id="serving-callout" class="text-sm font-black text-white mt-0.5">
          Team A is Serving from the Right Side
        </h3>
        <p class="text-[10px] text-slate-400 mt-0.5">
          Rule: Only the serving team gets a point if they win the rally!
        </p>
      </div>

      <!-- Big Two-Team Scoreboard -->
      <div class="grid grid-cols-2 gap-3 my-auto">
        <!-- Team A -->
        <div id="card-team-a" class="p-4 rounded-3xl bg-sky-950/30 border-2 border-sky-400 text-center shadow-lg">
          <span class="text-xs font-black text-sky-400 uppercase tracking-wide block">Team A (Us)</span>
          <span id="score-team-a" class="text-6xl font-black text-white font-mono my-2 block">0</span>
          <span id="serve-indicator-a" class="text-[10px] font-bold bg-[#CCFF00] text-black px-2 py-0.5 rounded-full inline-block">
            ⚡ Serving Now
          </span>
        </div>

        <!-- Team B -->
        <div id="card-team-b" class="p-4 rounded-3xl bg-slate-900/40 border border-slate-800 text-center">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wide block">Team B (Them)</span>
          <span id="score-team-b" class="text-6xl font-black text-slate-300 font-mono my-2 block">0</span>
          <span id="serve-indicator-b" class="text-[10px] font-bold bg-slate-800 text-slate-500 px-2 py-0.5 rounded-full inline-block">
            Receiving
          </span>
        </div>
      </div>

      <!-- Who Won the Rally? Buttons -->
      <div class="space-y-2.5">
        <span class="text-[11px] font-bold text-slate-400 text-center block uppercase tracking-wider">
          Tap Who Won the Last Point:
        </span>

        <div class="grid grid-cols-2 gap-2.5">
          <button
            onclick="addPoint('A')"
            class="py-4 px-3 rounded-2xl bg-gradient-to-br from-sky-600 to-sky-700 hover:from-sky-500 text-white font-black text-xs flex flex-col items-center justify-center gap-1 shadow-lg active:scale-95 transition cursor-pointer"
          >
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>TEAM A WON RALLY</span>
          </button>

          <button
            onclick="addPoint('B')"
            class="py-4 px-3 rounded-2xl bg-gradient-to-br from-amber-600 to-amber-700 hover:from-amber-500 text-white font-black text-xs flex flex-col items-center justify-center gap-1 shadow-lg active:scale-95 transition cursor-pointer"
          >
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>TEAM B WON RALLY</span>
          </button>
        </div>

        <button
          onclick="handleSideOut()"
          class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold flex items-center justify-center gap-1.5 transition cursor-pointer"
        >
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-[#CCFF00]"></i>
          <span>Fault / Pass Serve to Other Team</span>
        </button>
      </div>

    </div>

    <!-- Match Timer Footer -->
    <div class="p-3 bg-[#111827] border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
      <span>Match Time: <strong id="timer-display" class="text-white font-mono">00:00</strong></span>
      <span class="text-emerald-400 font-semibold">Game active</span>
    </div>

  </div>

  <script>
    let scoreA = 0;
    let scoreB = 0;
    let serving = 'A';
    let seconds = 0;

    function addPoint(team) {
      if (team === serving) {
        if (team === 'A') scoreA++;
        else scoreB++;
      } else {
        // Switch serve if receiver wins rally
        serving = (serving === 'A') ? 'B' : 'A';
      }
      updateUI();
      checkWin();
    }

    function handleSideOut() {
      serving = (serving === 'A') ? 'B' : 'A';
      updateUI();
    }

    function updateUI() {
      document.getElementById('score-team-a').innerText = scoreA;
      document.getElementById('score-team-b').innerText = scoreB;

      const cardA = document.getElementById('card-team-a');
      const cardB = document.getElementById('card-team-b');
      const indA = document.getElementById('serve-indicator-a');
      const indB = document.getElementById('serve-indicator-b');
      const callout = document.getElementById('serving-callout');

      if (serving === 'A') {
        cardA.className = "p-4 rounded-3xl bg-sky-950/30 border-2 border-sky-400 text-center shadow-lg";
        cardB.className = "p-4 rounded-3xl bg-slate-900/40 border border-slate-800 text-center";
        indA.className = "text-[10px] font-bold bg-[#CCFF00] text-black px-2 py-0.5 rounded-full inline-block";
        indA.innerText = "⚡ Serving Now";
        indB.className = "text-[10px] font-bold bg-slate-800 text-slate-500 px-2 py-0.5 rounded-full inline-block";
        indB.innerText = "Receiving";
        callout.innerText = "Team A (Us) is Serving!";
      } else {
        cardB.className = "p-4 rounded-3xl bg-amber-950/30 border-2 border-amber-400 text-center shadow-lg";
        cardA.className = "p-4 rounded-3xl bg-slate-900/40 border border-slate-800 text-center";
        indB.className = "text-[10px] font-bold bg-[#CCFF00] text-black px-2 py-0.5 rounded-full inline-block";
        indB.innerText = "⚡ Serving Now";
        indA.className = "text-[10px] font-bold bg-slate-800 text-slate-500 px-2 py-0.5 rounded-full inline-block";
        indA.innerText = "Receiving";
        callout.innerText = "Team B (Them) is Serving!";
      }
    }

    function checkWin() {
      if ((scoreA >= 11 && scoreA - scoreB >= 2) || (scoreB >= 11 && scoreB - scoreA >= 2)) {
        alert(`Game Over! ${scoreA > scoreB ? 'Team A' : 'Team B'} Wins (${scoreA} - ${scoreB})!`);
        resetMatch();
      }
    }

    function resetMatch() {
      scoreA = 0;
      scoreB = 0;
      serving = 'A';
      updateUI();
    }

    setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `${m}:${s}`;
    }, 1000);

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
